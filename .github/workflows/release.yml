# Builds the installers and publishes them as a GitHub release.
# Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # The pure logic only; the Rust tests need a desktop toolkit and run on
      # the build machines below.
      - run: npm test

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      # One platform failing should not stop the other from publishing.
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Apple Silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "먼작귀모니터링 ${{ github.ref_name }}"
          releaseBody: |
            설치 방법은 README의 "내려받아 쓰기"를 보세요.
            - Mac: `.dmg` (Apple Silicon, Intel 공용)
            - Windows: `-setup.exe`
            서명되지 않은 앱이라 처음 열 때 경고가 뜹니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
