<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mascot.css" />
  </head>
  <body>
    <header class="top" data-tauri-drag-region>
      <svg class="dots" aria-hidden="true">
        <circle cx="12" cy="12" r="3.5" /><circle cx="46" cy="12" r="3.5" /><circle cx="80" cy="12" r="3.5" /><circle cx="114" cy="12" r="3.5" /><circle cx="148" cy="12" r="3.5" /><circle cx="182" cy="12" r="3.5" /><circle cx="216" cy="12" r="3.5" /><circle cx="250" cy="12" r="3.5" /><circle cx="284" cy="12" r="3.5" />
        <circle cx="12" cy="46" r="3.5" /><circle cx="46" cy="46" r="3.5" /><circle cx="80" cy="46" r="3.5" /><circle cx="114" cy="46" r="3.5" /><circle cx="148" cy="46" r="3.5" /><circle cx="182" cy="46" r="3.5" /><circle cx="216" cy="46" r="3.5" /><circle cx="250" cy="46" r="3.5" /><circle cx="284" cy="46" r="3.5" />
      </svg>
      <!-- The mascot: drawn by mascot.js into this box. -->
      <div class="mascot" id="mascot" aria-hidden="true"></div>
      <div class="say" id="say" data-tauri-drag-region>
        <span id="mood-text" data-tauri-drag-region>한가해요</span>
      </div>
      <button id="pin" class="round-btn" type="button" aria-pressed="false" title="항상 위에 고정">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M9.6 2.2l4.2 4.2-1.9.5-2.2 2.2.2 2.9-1 1-2.6-2.6-3.6 3.6-.7-.7 3.6-3.6L3 7.1l1-1 2.9.2 2.2-2.2z" />
        </svg>
      </button>
      <button id="hide" class="round-btn" type="button" title="숨기기">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="x" d="M4.2 4.2l7.6 7.6m0-7.6l-7.6 7.6" />
        </svg>
      </button>
    </header>

    <main>
      <section class="card cpu">
        <div class="line">
          <span class="tag">CPU</span>
          <span class="value" id="cpu-value">—</span>
        </div>
        <svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
          <polygon id="cpu-area" points="" />
          <polyline id="cpu-spark" points="" />
        </svg>
        <div class="cores" id="cpu-cores" aria-label="코어별 사용률"></div>
      </section>

      <section class="card gpu">
        <div class="line">
          <span class="tag">GPU</span>
          <span class="value" id="gpu-value">—</span>
        </div>
        <svg class="spark" id="gpu-spark-box" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
          <polygon id="gpu-area" points="" />
          <polyline id="gpu-spark" points="" />
        </svg>
      </section>

      <div class="pair">
        <section class="card mem">
          <div class="line">
            <span class="tag">MEM</span>
            <span class="value" id="mem-percent">—</span>
          </div>
          <div class="meter"><div class="fill" id="mem-fill"></div></div>
          <div class="detail" id="mem-value">—</div>
        </section>

        <section class="card disk">
          <div class="line">
            <span class="tag">DISK</span>
            <span class="value" id="disk-percent">—</span>
          </div>
          <div class="meter"><div class="fill" id="disk-fill"></div></div>
          <div class="detail" id="disk-value">—</div>
        </section>
      </div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
