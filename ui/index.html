<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar" data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>System Monitor</span>
      <button id="pin" class="icon-btn" type="button" aria-pressed="false" title="항상 위에 고정">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M10 1.5 14.5 6l-2 .6-2.4 2.4.3 3.2-1.2 1.2-2.8-2.8L2.5 14.5l-.9-.1-.1-.9 3.9-3.9-2.8-2.8 1.2-1.2 3.2.3 2.4-2.4z" />
        </svg>
      </button>
      <button id="hide" class="icon-btn" type="button" title="숨기기">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 3.5l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <main>
      <section class="row cpu">
        <div class="line">
          <span class="label">CPU</span>
          <svg class="spark" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
            <polyline id="cpu-spark" points="" />
          </svg>
          <span class="value" id="cpu-value">—</span>
        </div>
        <div class="cores" id="cpu-cores" aria-label="코어별 사용률"></div>
      </section>

      <section class="row gpu">
        <div class="line">
          <span class="label">GPU</span>
          <svg class="spark" id="gpu-spark-box" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
            <polyline id="gpu-spark" points="" />
          </svg>
          <span class="value" id="gpu-value">—</span>
        </div>
      </section>

      <section class="row mem">
        <div class="line">
          <span class="label">MEM</span>
          <span class="value wide" id="mem-value">—</span>
        </div>
        <div class="meter"><div class="fill" id="mem-fill"></div></div>
      </section>

      <section class="row disk">
        <div class="line">
          <span class="label">DISK</span>
          <span class="value wide" id="disk-value">—</span>
        </div>
        <div class="meter"><div class="fill" id="disk-fill"></div></div>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
