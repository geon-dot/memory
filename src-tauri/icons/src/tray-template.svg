<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- macOS menu bar icon: 칩이 as a one-colour shape with the face cut out.
       A template image: only its transparency is used, and macOS colours it
       for a light or a dark menu bar. Drawn for this app. -->
  <defs>
    <mask id="face">
      <rect width="36" height="36" fill="#fff" />
      <rect x="12.4" y="11.4" width="3.4" height="6.8" rx="1.7" fill="#000" />
      <rect x="20.2" y="11.4" width="3.4" height="6.8" rx="1.7" fill="#000" />
      <path d="M14.6 21.2q3.4 3 6.8 0" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round" />
    </mask>
  </defs>
  <g fill="#000">
    <rect x="2" y="9" width="6.5" height="3.2" rx="1.6" />
    <rect x="2" y="14.4" width="6.5" height="3.2" rx="1.6" />
    <rect x="2" y="19.8" width="6.5" height="3.2" rx="1.6" />
    <rect x="27.5" y="9" width="6.5" height="3.2" rx="1.6" />
    <rect x="27.5" y="14.4" width="6.5" height="3.2" rx="1.6" />
    <rect x="27.5" y="19.8" width="6.5" height="3.2" rx="1.6" />
    <rect x="11.6" y="25" width="4.2" height="7.6" rx="2.1" />
    <rect x="20.2" y="25" width="4.2" height="7.6" rx="2.1" />
    <rect x="7" y="4.6" width="22" height="22.6" rx="6.4" mask="url(#face)" />
  </g>
</svg>
